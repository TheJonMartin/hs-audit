name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: black --check src tests && isort --check-only src tests
      - name: Tests
        run: pytest
      - name: Security audit
        run: pip-audit
      - name: Pre-commit mirror
        run: pre-commit run --all-files
