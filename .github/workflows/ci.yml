name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: black --check src tests && isort --check-only src tests
      - name: Tests
        run: pytest
      - name: Security audit
        run: pip-audit
      - name: Pre-commit mirror
        run: pre-commit run --all-files
  netlify-receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: netlify
      - name: Tests
        run: npm test
        working-directory: netlify
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: netlify
