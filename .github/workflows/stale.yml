name: Stale PRs
on:
  schedule:
    - cron: "17 6 * * *"
permissions:
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-pr-stale: 9
          days-before-pr-close: 9
          days-before-issue-stale: -1
          days-before-issue-close: -1
          exempt-pr-labels: pinned,keep-open,security
          exempt-draft-pr: true
