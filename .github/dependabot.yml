version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip-all:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github_actions-all:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /netlify
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-all:
        patterns:
          - "*"
